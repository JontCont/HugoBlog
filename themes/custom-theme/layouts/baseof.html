<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="page-kind-{{ .Kind }}{{ with .Section }} section-{{ . | urlize }}{{ end }}">
  <div class="reading-progress" id="reading-progress" aria-hidden="true"></div>
  <header class="site-header">
    {{ partial "header.html" . }}
  </header>
  <div class="site-shell">
    <main class="site-main" id="main-content">
      {{ block "main" . }}{{ end }}
    </main>
    <footer class="site-footer">
      {{ partial "footer.html" . }}
    </footer>
  </div>
  {{ partial "search-modal.html" . }}
  {{ if or (.Store.Get "hasMermaid") (strings.Contains .Content "mermaid") }}
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    try {
      const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      mermaid.initialize({
        startOnLoad: false,
        theme: isDark ? 'dark' : 'default',
        securityLevel: 'loose',
        fontFamily: 'inherit'
      });
      await mermaid.run({
        nodes: document.querySelectorAll('pre.mermaid, .mermaid')
      });
    } catch (err) {
      console.error('Mermaid render error:', err);
    }
  </script>
  {{ end }}
</body>
</html>
